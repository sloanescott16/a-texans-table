<html lang="en">
<head>

<style>
:root{
  --ground:#F3EBDA; --card:#FAF4E7; --ink:#33291F; --muted:#7A6A56; --rule:#D9C9AF;
  --citrus:#A85C34; --citrus-bg:#F0DFD1; --brine:#7E7047; --brine-bg:#E8E3D0;
  --shell:#6E4A2E; --shell-bg:#EADCC9; --field:#FFFCF5;
  --sans:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Cutive Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --stamp:"Special Elite","Courier New",Courier,monospace;
}
@media (prefers-color-scheme:dark){
 :root{
  --ground:#17130F; --card:#211C15; --ink:#F1E3CE; --muted:#A2937C; --rule:#3A3026;
  --citrus:#D3814F; --citrus-bg:#2E2018; --brine:#A99A63; --brine-bg:#222014;
  --shell:#C89B6E; --shell-bg:#2A2018; --field:#1B1610;
 }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;padding-bottom:calc(56px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
h1{font-family:var(--stamp);font-size:clamp(26px,8.5vw,34px);line-height:1.1;letter-spacing:0.03em;text-transform:uppercase;font-weight:400;margin:34px 0 8px}
h1 a{color:inherit;text-decoration:none}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:32em}
h2{font-family:var(--stamp);font-size:13px;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:24px 0 10px}
h2.big{font-size:clamp(20px,6vw,26px);letter-spacing:0.04em;color:var(--ink);margin:6px 0 4px}
.line{color:var(--muted);font-size:14px;margin:0 0 6px}
a.back{display:inline-block;font-family:var(--mono);font-size:13px;letter-spacing:0.06em;color:var(--muted);text-decoration:none;margin:4px 0 14px}
a.back:active{color:var(--ink)}

/* search bar */
.find{display:flex;gap:8px;align-items:stretch;margin:0 0 10px}
.find input{flex:1;min-width:0;background:var(--field);border:1px solid var(--rule);border-radius:3px;color:var(--ink);font-family:var(--sans);font-size:16px;padding:11px 12px;height:46px}
.find input:focus{outline:none;border-color:var(--brine)}
.find input::placeholder{color:var(--muted)}
.btn{background:transparent;border:1px solid var(--rule);border-radius:3px;color:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;padding:0 12px;height:46px;cursor:pointer;white-space:nowrap}
.btn:active,.btn.on{background:var(--citrus-bg);border-color:var(--citrus);color:var(--citrus)}
.btn.sm{height:34px;padding:0 10px;font-size:11px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--rule);border-radius:2px;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:7px 9px;cursor:pointer;line-height:1}
.chip.on{background:var(--citrus-bg);border-color:var(--citrus);color:var(--citrus)}
.group{margin:12px 0 0}
.group h3{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:0 0 6px}
#filters{display:none;border:1px solid var(--rule);background:var(--card);border-radius:3px;padding:10px 12px 14px;margin:0 0 12px}
#filters.open{display:block}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.count{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}

/* time dial */
.dial{margin:4px 0 6px;padding:6px 0 0}
.dial-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dial-lab{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)}
.dial-val{font-family:var(--stamp);font-size:18px;letter-spacing:0.04em;color:var(--citrus)}
.dial-val.off{color:var(--muted)}
#dial{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;padding:0;cursor:pointer}
#dial:focus{outline:none}
#dial::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--citrus) 0,var(--citrus) var(--pct,100%),var(--rule) var(--pct,100%),var(--rule) 100%)}
#dial::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
#dial::-moz-range-progress{height:6px;border-radius:3px;background:var(--citrus)}
#dial::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--field);border:2px solid var(--citrus);margin-top:-12px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#dial::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--field);border:2px solid var(--citrus);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.dial-ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:-4px}

/* menu (sections open in place) */
button.sec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:18px 2px;color:inherit;font:inherit;min-height:64px;cursor:pointer}
button.sec:active{background:var(--card)}
.sec .tog{font-family:var(--mono);font-size:17px;color:var(--muted);margin-left:6px;transition:transform .15s}
.sec.open .tog{transform:rotate(90deg);color:var(--citrus)}
.drawer{display:none;padding:0 0 6px 6px;border-bottom:1px solid var(--rule)}
.drawer.open{display:block}
.drawer a.rec:last-child{border-bottom:0}
.drawer .line{padding:8px 0 2px}
.sec .nm{display:block;font-family:var(--stamp);font-size:20px;letter-spacing:0.03em;line-height:1.2}
.sec .ln{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sec .n{margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:0.1em;color:var(--muted);white-space:nowrap}

/* recipe rows */
a.rec{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule);padding:14px 2px;text-decoration:none;color:inherit;min-height:56px}
a.rec:active{background:var(--card)}
.dot{flex:0 0 auto;align-self:flex-start;margin-top:2px;display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:4px 6px;border-radius:2px;font-family:var(--mono);font-size:10px;letter-spacing:0.1em}
.d-PAN,.d-OVEN{background:var(--shell-bg);color:var(--shell)}
.d-FIRE,.d-CUP{background:var(--citrus-bg);color:var(--citrus)}
.d-POT,.d-JAR,.d-BOWL{background:var(--brine-bg);color:var(--brine)}
.d-TEST{background:var(--rule);color:var(--muted)}
.rec .nm{display:block;font-family:var(--stamp);font-size:16px;letter-spacing:0.02em;line-height:1.25}
.rec .meta{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}
.rec .have{display:block;font-size:12px;color:var(--brine);margin-top:3px}
.rec .miss{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.arw{margin-left:auto;align-self:center;color:var(--muted);font-family:var(--mono);font-size:17px}
.empty{color:var(--muted);font-size:14px;padding:18px 0}
.note{color:var(--muted);font-size:13px;line-height:1.55;margin:22px 0 0;border-top:1px solid var(--rule);padding-top:16px}

/* fridge */
#have{display:block;width:100%;min-height:84px;resize:vertical;background:var(--field);border:1px solid var(--rule);border-radius:3px;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;padding:10px 12px}
#have:focus{outline:none;border-color:var(--brine)}
#have::placeholder{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
:focus-visible{outline:2px solid var(--brine);outline-offset:2px}
</style>
</head>

function tlabel(m){

/* ---------- state lives in the hash so the back button works ---------- */
function parse(){
  var h = location.hash.replace(/^#/,"");
  var st = {view:"menu", q:"", sel:{}, chapter:"", have:""};
  if(!h) return st;
  var parts = h.split("?"); var head = parts[0]; var qs = parts[1]||"";
  if(head==="find") st.view="find";
  else if(head==="fridge") st.view="fridge";
  else if(CH[head]){ st.view="menu"; st.chapter=head; }
  qs.split("&").forEach(function(kv){
    if(!kv) return;
    var i = kv.indexOf("="); var k = decodeURIComponent(kv.slice(0,i)); var v = decodeURIComponent(kv.slice(i+1));
    if(k==="q") st.q = v;
    else if(k==="have") st.have = v;
    else if(k==="time"){ var tv=parseInt(v,10); if(tv>0 && tv<9999) st.sel.time=[String(tv)]; }
    else if(F[k]) st.sel[k] = v.split(",").filter(Boolean);
  });
  return st;
}
function build(st){
  var head = st.view==="menu" ? (st.chapter||"") : st.view;
  var qs = [];
  if(st.q) qs.push("q="+encodeURIComponent(st.q));
  if(st.have) qs.push("have="+encodeURIComponent(st.have));
  Object.keys(st.sel).forEach(function(k){ if(st.sel[k] && st.sel[k].length) qs.push(k+"="+encodeURIComponent(st.sel[k].join(","))); });
  if(!head && !qs.length) return "#";
  return "#"+head+(qs.length?"?"+qs.join("&"):"");
}
var S = parse();
function go(st, replace, keepOpen){
  var h = build(st);
  if(!replace && !keepOpen) document.getElementById("filters").classList.remove("open");
  if(replace) history.replaceState(null,"",h); else if(h!==location.hash) history.pushState(null,"",h);
  S = st; render();
}
window.addEventListener("hashchange", function(){ S = parse(); render(); });
window.addEventListener("popstate", function(){ S = parse(); render(); });

function anyFilter(st){ return Object.keys(st.sel).some(function(k){ return st.sel[k] && st.sel[k].length; }); }

/* ---------- matching ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
function stem(w){ return w.length>4 && /s$/.test(w) && !/ss$/.test(w) ? w.slice(0,-1) : w; }
function words(s){ return norm(s).split(" ").filter(function(w){ return w.length>1; }).map(stem); }

function passes(r, st){
  var sel = st.sel;
  if(sel.meal && sel.meal.length && !sel.meal.some(function(v){ return r.meal.indexOf(v)>=0; })) return false;
  if(sel.protein && sel.protein.length && !sel.protein.some(function(v){ return r.protein.indexOf(v)>=0; })) return false;
  if(sel.heat && sel.heat.length && !sel.heat.some(function(v){ return r.heat.indexOf(v)>=0; })) return false;
  if(sel.effort && sel.effort.length && sel.effort.indexOf(String(r.effort))<0) return false;
  if(sel.occasion && sel.occasion.length && !sel.occasion.some(function(v){ return r.occasion.indexOf(v)>=0; })) return false;
  if(sel.time && sel.time.length){ var max = +sel.time[0]; if(max<9999 && (r.total===null || r.total>max)) return false; }
  if(sel.extra && sel.extra.length){ for(var i=0;i<sel.extra.length;i++){ if(!r[sel.extra[i]]) return false; } }
  if(st.q){
    var hay = norm(r.name+" "+r.blurb+" "+r.sub+" "+r.ingredients.join(" ")+" "+r.protein.join(" ")+" "+r.heat.join(" ")+" "+r.meal.join(" ")+" "+CH[r.chapter].name);
    var ws = words(st.q);
    for(var j=0;j<ws.length;j++){ if(hay.indexOf(ws[j])<0) return false; }
  }
  return true;
}
function easiestFirst(a,b){
  if(a.test!==b.test) return a.test?1:-1;
  if(a.effort!==b.effort) return a.effort-b.effort;
  var ta = a.total===null?1e9:a.total, tb = b.total===null?1e9:b.total;
  if(ta!==tb) return ta-tb;
  return a.name.localeCompare(b.name);
}

/* fridge: which of the user's ingredients does each recipe use */
function fridgeMatch(r, terms){
  var have=[], seen={};
  r.ingredients.forEach(function(ing){
    var iw = words(ing);
    terms.forEach(function(t){
      if(seen[t]) return;
      var tw = words(t);
      var hit = tw.length && tw.every(function(w){ return iw.some(function(x){ return x===w || (w.length>3 && (x.indexOf(w)===0 || w.indexOf(x)===0)); }); });
      if(hit){ have.push(t); seen[t]=1; }
    });
  });
  var missing = r.ingredients.filter(function(ing){
    var iw = words(ing.replace(/\s*\(.*$/,""));
    if(iw.length && iw.every(function(w){ return STAPLEWORDS.indexOf(w)>=0; })) return false;
    return !terms.some(function(t){ var tw=words(t); return tw.length && tw.every(function(w){ return iw.some(function(x){ return x===w || (w.length>3 && (x.indexOf(w)===0 || w.indexOf(x)===0)); }); }); });
  }).map(function(ing){ return ing.replace(/\s*\(.*$/,""); });
  return {have:have, missing:missing};
}

/* ---------- rendering ---------- */
function meta(r){
  var bits=[r.time, EFFORT[r.effort]];
  var p = r.protein.filter(function(x){ return x!=="none"; });
  if(p.length) bits.push(p.join(", "));
  if(r.serves && r.scales) bits.push("serves "+r.serves);
  return bits.join(" · ");
}
function row(r, extra){
  return '<a class="rec" href="./'+r.file+'">'+
    '<span class="dot d-'+r.label+'">'+r.label+'</span>'+
    '<span><span class="nm">'+esc(r.name)+'</span><span class="meta">'+esc(meta(r))+'</span>'+(extra||"")+'</span>'+
    '<span class="arw" aria-hidden="true">&rsaquo;</span></a>';
}
function grouped(list, extraFn){
  var out="";
  DATA.chapters.forEach(function(c){
    var rs = list.filter(function(r){ return r.chapter===c.id; });
    if(!rs.length) return;
    out += '<h2>'+esc(c.name)+'</h2>' + rs.map(function(r){ return row(r, extraFn?extraFn(r):""); }).join("");
  });
  return out;
}

    view.innerHTML = html;
    var ta = document.getElementById("have");
    var t; ta.addEventListener("input", function(){ clearTimeout(t); t=setTimeout(function(){ var st=parse(); st.view="fridge"; st.have=ta.value; go(st,true); var el=document.getElementById("have"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); },350); });
    document.getElementById("fcount").textContent = "";
    return;
  }

  var searching = S.q || anyFilter(S);
  if(S.view==="find" || (S.view==="menu" && searching)){
    var list = DATA.recipes.filter(function(r){ return passes(r,S); }).sort(easiestFirst);
    tag.textContent = "Easiest first. Tap a recipe for the clock and the checklist.";
    view.innerHTML = '<a class="back" href="#">&lsaquo; Menu</a>' +
      '<div class="frow" style="margin:0 0 4px"><span class="count">'+list.length+(list.length===1?" recipe":" recipes")+'</span><button class="btn sm" id="clearall">Clear</button></div>' +
      (list.length ? grouped(list) : '<p class="empty">Nothing matches that. Loosen a filter or try one word.</p>');
    document.getElementById("fcount").textContent = list.length+" match";
    return;
  }
  /* menu: sections open in place, easiest first inside each */
  tag.textContent = "Pick a section, or say what you are after.";
  view.innerHTML = DATA.chapters.map(function(c){
    var rs = DATA.recipes.filter(function(r){ return r.chapter===c.id; }).sort(easiestFirst);
    var open = S.chapter===c.id;
    return '<button class="sec'+(open?" open":"")+'" data-sec="'+c.id+'" aria-expanded="'+(open?"true":"false")+'"><span><span class="nm">'+esc(c.name)+'</span><span class="ln">'+esc(c.line)+'</span></span><span class="n">'+rs.length+'</span><span class="tog" aria-hidden="true">&rsaquo;</span></button>'+
      '<div class="drawer'+(open?" open":"")+'">'+rs.map(function(r){ return row(r); }).join("")+'</div>';
  }).join("") + '<p class="note">Every recipe runs as a checklist; the full cooks run on a clock. Works offline once it has loaded here. On the phone, open it in Safari, tap Share, then Add to Home Screen for the icon.</p>';
  document.getElementById("fcount").textContent = "";
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var chip = e.target.closest(".chip");
  if(chip){
    e.preventDefault();
    var st = parse();
    if(chip.dataset.quick!==undefined){
      var k = chip.dataset.quick, v = chip.dataset.v;
      if(k==="fridge"){ st.view = st.view==="fridge" ? "menu" : "fridge"; go(st, false, true); return; }
      var cur = st.sel[k]||[]; st.sel[k] = cur.indexOf(v)>=0 ? cur.filter(function(x){ return x!==v; }) : (F[k].single ? [v] : cur.concat([v]));
      if(st.view==="menu"){ st.view = "find"; st.chapter=""; }
      if(!anyFilter(st) && !st.q && st.view==="find") st.view="menu";
      go(st, false, true); return;
    }
    var k2 = chip.dataset.k, v2 = chip.dataset.v; var cur2 = st.sel[k2]||[];
    st.sel[k2] = cur2.indexOf(v2)>=0 ? cur2.filter(function(x){ return x!==v2; }) : (F[k2].single ? [v2] : cur2.concat([v2]));
    if(st.view==="menu"){ st.view = "find"; st.chapter=""; }
    if(!anyFilter(st) && !st.q && st.view==="find") st.view="menu";
    go(st, false, true); return;
  }
  var sec = e.target.closest("button.sec");
  if(sec){
    e.preventDefault();
    var s3 = parse(); s3.chapter = s3.chapter===sec.dataset.sec ? "" : sec.dataset.sec;
    go(s3, true);
    if(s3.chapter){ var el = document.querySelector('button.sec[data-sec="'+s3.chapter+'"]'); if(el && el.getBoundingClientRect().top<0) el.scrollIntoView({block:"start"}); }
    return;
  }
  if(e.target.id==="ftog"){ e.preventDefault(); document.getElementById("filters").classList.toggle("open"); render(); return; }
  if(e.target.id==="fclear"){ e.preventDefault(); var s2=parse(); s2.sel={}; if(s2.view==="find" && !s2.q) s2.view="menu"; go(s2); document.getElementById("filters").classList.remove("open"); render(); return; }
  if(e.target.id==="clearall"){ e.preventDefault(); go({view:"menu",q:"",sel:{},chapter:"",have:""}); document.getElementById("filters").classList.remove("open"); render(); return; }
});
document.addEventListener("input", function(e){
  if(e.target.id!=="dial") return;
  var m = STOPS[+e.target.value]; var st = parse();
  if(m>=9999) delete st.sel.time; else st.sel.time=[String(m)];
  if(st.view==="menu"){ if(anyFilter(st)||st.q){ st.view="find"; st.chapter=""; } }
  else if(st.view==="find" && !anyFilter(st) && !st.q) st.view="menu";
  go(st, true, true);
});
var qt;
document.getElementById("q").addEventListener("input", function(){
  clearTimeout(qt); var val=this.value;
  qt = setTimeout(function(){ var st=parse(); st.q=val.trim(); st.view = (st.q||anyFilter(st)) ? "find" : "menu"; if(st.view==="find") st.chapter=""; go(st, true); }, 200);
});
document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") this.blur(); });

render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(function(){}); }
</script>
</body>
</html>
